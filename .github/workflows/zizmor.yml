name: zizmor static analysis

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        # The action's `latest` only knows releases current at its own release
        # (v0.8.0 -> zizmor 1.31.1, which predates lockfile support), so pin
        # the lockfile-aware zizmor explicitly. Sync with pyproject.toml.
        uses: zizmorcore/zizmor-action@v0.8.0
        with:
          version: 1.32.0

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  # https://docs.github.com/en/actions/how-tos/administer/enforce-workflow-lockfiles
  lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify the actions lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
